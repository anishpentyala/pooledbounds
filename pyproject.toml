[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
readme = "README.md"
name = "pooledbounds"
version = "0.2.0"
description = "Bounds, not interpolated guesses, for pooled unequal-bin histograms"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
pooledbounds = "pooledbounds.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
